<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1e293b">
  <title>حاسبة الأرباح</title>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --input-bg: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --success: #22c55e;
      --danger: #ef4444;
      --border: #475569;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Tahoma, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .calculator-card {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 420px;
      border-radius: 24px;
      padding: 28px 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #60a5fa;
      margin-bottom: 6px;
    }

    .header p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: #cbd5e1;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper input {
      width: 100%;
      background-color: var(--input-bg);
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 1.2rem;
      font-weight: bold;
      color: #ffffff;
      outline: none;
      transition: all 0.2s ease;
      direction: ltr;
      text-align: right;
    }

    .input-wrapper input:focus {
      border-color: #60a5fa;
      background-color: #3b4c66;
      box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.25);
    }

    .input-wrapper input::placeholder {
      color: #64748b;
      font-weight: normal;
    }

    .result-box {
      margin-top: 24px;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 2px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      text-align: center;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .result-box.profit {
      border-color: var(--success);
      background: linear-gradient(135deg, rgba(34, 197, 94, 0.12), rgba(15, 23, 42, 0.8));
    }

    .result-box.loss {
      border-color: var(--danger);
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.12), rgba(15, 23, 42, 0.8));
    }

    .result-title {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .result-status {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .result-amount {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      direction: ltr;
      display: inline-block;
    }

    .profit .result-status, .profit .result-amount {
      color: var(--success);
    }

    .loss .result-status, .loss .result-amount {
      color: var(--danger);
    }

    .neutral .result-amount {
      color: #f8fafc;
    }

    .action-buttons {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    .btn {
      flex: 1;
      padding: 13px;
      border-radius: 14px;
      border: none;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-reset {
      background-color: #334155;
      color: #cbd5e1;
    }

    .btn-reset:hover {
      background-color: #475569;
      color: #fff;
    }

    .formula-badge {
      text-align: center;
      margin-top: 18px;
      font-size: 0.78rem;
      color: #64748b;
      direction: rtl;
    }
  </style>
</head>
<body>

  <div class="calculator-card">
    <div class="header">
      <h1>حاسبة الأرباح</h1>
      <p>احسب صافي الربح أو الخسارة لحظياً</p>
    </div>

    <div class="form-group">
      <label for="lastAmount">المبلغ الأخير</label>
      <div class="input-wrapper">
        <input type="number" id="lastAmount" inputmode="decimal" placeholder="0.00" oninput="calculate()">
      </div>
    </div>

    <div class="form-group">
      <label for="capitalSay">كابيتال say</label>
      <div class="input-wrapper">
        <input type="number" id="capitalSay" inputmode="decimal" placeholder="0.00" oninput="calculate()">
      </div>
    </div>

    <div class="form-group">
      <label for="monthProfits">أرباح الشهر</label>
      <div class="input-wrapper">
        <input type="number" id="monthProfits" inputmode="decimal" placeholder="0.00" oninput="calculate()">
      </div>
    </div>

    <div class="result-box neutral" id="resultContainer">
      <div class="result-title">النتيجة (الربح أو الخسارة)</div>
      <div class="result-status" id="resultStatus">أدخل الأرقام للحساب اللحظي</div>
      <div class="result-amount" id="resultValue">0.00</div>
    </div>

    <div class="action-buttons">
      <button class="btn btn-reset" onclick="resetForm()">مسح الحقول</button>
    </div>

    <div class="formula-badge">
      المعادلة: المبلغ الأخير - كابيتال say - أرباح الشهر
    </div>
  </div>

  <script>
    function calculate() {
      const lastAmountVal = document.getElementById('lastAmount').value.trim();
      const capitalSayVal = document.getElementById('capitalSay').value.trim();
      const monthProfitsVal = document.getElementById('monthProfits').value.trim();

      const lastAmount = parseFloat(lastAmountVal) || 0;
      const capitalSay = parseFloat(capitalSayVal) || 0;
      const monthProfits = parseFloat(monthProfitsVal) || 0;

      const container = document.getElementById('resultContainer');
      const statusEl = document.getElementById('resultStatus');
      const valEl = document.getElementById('resultValue');

      if (!lastAmountVal && !capitalSayVal && !monthProfitsVal) {
        container.className = 'result-box neutral';
        statusEl.textContent = 'أدخل الأرقام للحساب اللحظي';
        valEl.textContent = '0.00';
        return;
      }

      // المعادلة: المبلغ الأخير - كابيتال say - أرباح الشهر
      const result = lastAmount - capitalSay - monthProfits;

      const formatted = new Intl.NumberFormat('en-US', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }).format(Math.abs(result));

      if (result > 0) {
        container.className = 'result-box profit';
        statusEl.textContent = 'صافي ربح 🎉';
        valEl.textContent = '+' + formatted;
      } else if (result < 0) {
        container.className = 'result-box loss';
        statusEl.textContent = 'صافي خسارة ⚠️';
        valEl.textContent = '-' + formatted;
      } else {
        container.className = 'result-box neutral';
        statusEl.textContent = 'نقطة التعادل (صفر)';
        valEl.textContent = '0.00';
      }
    }

    function resetForm() {
      document.getElementById('lastAmount').value = '';
      document.getElementById('capitalSay').value = '';
      document.getElementById('monthProfits').value = '';
      calculate();
      document.getElementById('lastAmount').focus();
    }
  </script>
</body>
</html>
